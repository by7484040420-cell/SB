name: Auto scan for new sarkari jobs

on:
  schedule:
    # Runs every 30 minutes, 24x7. Adjust as needed.
    - cron: "*/30 * * * *"
  workflow_dispatch: {} # lets you also trigger it manually from the Actions tab

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Call scan-jobs endpoint
        run: |
          curl -sf -X POST "${{ secrets.SITE_URL }}/api/cron/scan-jobs" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}"
